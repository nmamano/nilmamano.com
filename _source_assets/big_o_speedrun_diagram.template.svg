<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4a5c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a4f12"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9550"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- ===== Groups ===== -->
  <rect x="15" y="30" width="190" height="260" rx="12" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="30" y="54" font-size="13" font-weight="700" fill="#1a2030" letter-spacing="0.5">OUTSIDE</text>

  <rect x="300" y="30" width="260" height="310" rx="12" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="315" y="54" font-size="13" font-weight="700" fill="#1a2030" letter-spacing="0.5">GITHUB (bigospeedrun org)</text>

  <rect x="740" y="30" width="245" height="345" rx="12" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="755" y="54" font-size="13" font-weight="700" fill="#1a2030" letter-spacing="0.5">BROADCAST</text>

  <rect x="15" y="400" width="970" height="225" rx="12" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="30" y="424" font-size="13" font-weight="700" fill="#1a2030" letter-spacing="0.5">ISOMUX OFFICE</text>

  <!-- ===== Outside ===== -->
  <rect x="30" y="70" width="160" height="62" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <text x="110" y="96" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Players</text>
  <text x="110" y="116" font-size="12" fill="#5a6577" text-anchor="middle">people and their agents</text>

  <rect x="30" y="208" width="160" height="62" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <text x="110" y="234" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Community repos</text>
  <text x="110" y="254" font-size="12" fill="#5a6577" text-anchor="middle">tracked by the site</text>

  <!-- ===== GitHub ===== -->
  <rect x="315" y="70" width="230" height="80" rx="8" fill="#fdf4ec" stroke="#9a4f12" stroke-width="1.5"/>
  <text x="430" y="96" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">verifier repo</text>
  <text x="327" y="117" font-size="12" fill="#5a6577">• trusted Lean statements</text>
  <text x="327" y="135" font-size="12" fill="#5a6577">• sandboxed checks on GitHub runners</text>

  <rect x="315" y="215" width="230" height="105" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <text x="430" y="241" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">site repo</text>
  <text x="327" y="268" font-size="12" fill="#5a6577">• Astro site + records as JSON</text>
  <text x="327" y="288" font-size="12" fill="#5a6577">• hourly GitHub Actions workflow</text>

  <!-- ===== Broadcast ===== -->
  <rect x="760" y="70" width="205" height="62" rx="8" fill="#eef8f2" stroke="#1f9550" stroke-width="1.5"/>
  <text x="862" y="96" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">bigOspeedrun.com</text>
  <text x="862" y="116" font-size="12" fill="#5a6577" text-anchor="middle">Vercel</text>

  <rect x="760" y="180" width="205" height="62" rx="8" fill="#eef8f2" stroke="#1f9550" stroke-width="1.5"/>
  <text x="862" y="216" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Discord #records</text>

  <rect x="760" y="292" width="205" height="62" rx="8" fill="#eef8f2" stroke="#1f9550" stroke-width="1.5"/>
  <text x="862" y="318" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">X @bigospeedrun</text>
  <text x="862" y="338" font-size="12" fill="#5a6577" text-anchor="middle">Chrome on my old laptop</text>

  <!-- ===== Office ===== -->
  <rect x="35" y="440" width="180" height="90" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <text x="125" y="472" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Watch cronjob</text>
  <text x="125" y="492" font-size="12" fill="#5a6577" text-anchor="middle">fresh session every 3 h</text>
  <text x="125" y="510" font-size="12" fill="#5a6577" text-anchor="middle">GPT-6 Astra</text>

  <rect x="265" y="440" width="190" height="90" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <!--CHAR:bos-lead-dev:268:444:82-->
  <text x="390" y="481" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Lead Dev</text>
  <text x="390" y="501" font-size="12" fill="#5a6577" text-anchor="middle">Claude Opus 5.5</text>

  <rect x="505" y="440" width="200" height="90" rx="8" fill="#f5f7fb" stroke="#3d4a5c" stroke-width="1.5"/>
  <!--CHAR:bos-worker-1:509:441:62-->
  <!--CHAR:bos-worker-2:556:441:62-->
  <!--CHAR:bos-worker-3:603:441:62-->
  <!--CHAR:bos-worker-4:650:441:62-->
  <text x="605" y="512" font-size="14" font-weight="700" fill="#1a2030" text-anchor="middle">Workers 1-4</text>
  <text x="605" y="526" font-size="11" fill="#5a6577" text-anchor="middle">GPT-6 Astra</text>

  <rect x="290" y="565" width="140" height="45" rx="8" fill="#ffffff" stroke="#3d4a5c" stroke-width="1.5"/>
  <text x="360" y="593" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">Me</text>

  <rect x="765" y="440" width="195" height="90" rx="8" fill="#eef8f2" stroke="#1f9550" stroke-width="1.5"/>
  <!--CHAR:bos-x-poster:768:444:82-->
  <text x="890" y="472" font-size="15" font-weight="700" fill="#1a2030" text-anchor="middle">X Poster</text>
  <text x="890" y="492" font-size="12" fill="#5a6577" text-anchor="middle">no other job</text>
  <text x="890" y="510" font-size="12" fill="#5a6577" text-anchor="middle">GPT-6 Astra</text>

  <g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
  <!-- ===== Arrows: ingest (dark) ===== -->
  <line x1="110" y1="132" x2="110" y2="204" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="118" y="173" font-size="12" fill="#3d4a5c">PRs</text>

  <line x1="190" y1="245" x2="311" y2="258" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="212" y="276" font-size="12" fill="#3d4a5c">hourly import</text>

  <line x1="152" y1="440" x2="152" y2="274" stroke="#3d4a5c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="160" y="352" font-size="12" fill="#3d4a5c">searches GitHub for:</text>
  <text x="160" y="368" font-size="12" fill="#3d4a5c">• new repos</text>
  <text x="160" y="384" font-size="12" fill="#3d4a5c">• top contributors' activity</text>

  <line x1="215" y1="485" x2="261" y2="485" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="219" y="477" font-size="12" fill="#3d4a5c">alert</text>

  <line x1="459" y1="485" x2="501" y2="485" stroke="#3d4a5c" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="477" font-size="12" fill="#3d4a5c" text-anchor="middle">tasks</text>
  <text x="480" y="503" font-size="11" fill="#3d4a5c" text-anchor="middle">commits</text>

  <line x1="360" y1="530" x2="360" y2="561" stroke="#3d4a5c" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="368" y="550" font-size="12" fill="#3d4a5c">chat</text>

  <line x1="380" y1="440" x2="400" y2="324" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="404" y="368" font-size="12" fill="#3d4a5c">• registers community repos</text>
  <text x="402" y="384" font-size="12" fill="#3d4a5c">• adds one-off finds</text>

  <!-- ===== Arrows: verify (orange) ===== -->
  <line x1="190" y1="92" x2="311" y2="92" stroke="#9a4f12" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <text x="214" y="84" font-size="12" fill="#9a4f12">Lean proof</text>

  <line x1="311" y1="114" x2="194" y2="114" stroke="#9a4f12" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <text x="214" y="130" font-size="12" fill="#9a4f12">receipt</text>

  <line x1="430" y1="150" x2="430" y2="211" stroke="#9a4f12" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <text x="438" y="170" font-size="12" fill="#9a4f12">hourly import:</text>
  <text x="438" y="186" font-size="12" fill="#9a4f12">• submissions</text>
  <text x="438" y="202" font-size="12" fill="#9a4f12">• receipts</text>

  <!-- ===== Arrows: broadcast (green) ===== -->
  <line x1="545" y1="235" x2="756" y2="105" stroke="#1f9550" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="650" y="162" font-size="12" fill="#1f9550" text-anchor="middle" transform="rotate(-31.6 650 170)">deploy on push</text>

  <line x1="545" y1="262" x2="756" y2="214" stroke="#1f9550" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="650" y="231" font-size="12" fill="#1f9550" text-anchor="middle" transform="rotate(-12.8 650 238)">webhook</text>

  <line x1="545" y1="305" x2="800" y2="436" stroke="#1f9550" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="645" y="351" font-size="12" fill="#1f9550" text-anchor="middle" transform="rotate(28.1 645 359)">push webhook (via Isomux)</text>

  <line x1="890" y1="440" x2="890" y2="358" stroke="#1f9550" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="898" y="392" font-size="12" fill="#1f9550">browser use</text>
  </g>
</svg>
