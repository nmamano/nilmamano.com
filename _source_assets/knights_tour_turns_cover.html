<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06080f; }
  #card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 620px at 80% 50%, #102a33 0%, rgba(16,42,51,0) 68%),
      linear-gradient(140deg, #0a1120 0%, #070c17 52%, #05080f 100%);
  }
  #card::before {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background-image:
      repeating-linear-gradient(45deg, rgba(120,160,230,.055) 0 1px, transparent 1px 84px),
      repeating-linear-gradient(-45deg, rgba(120,160,230,.055) 0 1px, transparent 1px 84px);
  }
  .left { position: absolute; left: 72px; top: 150px; }
  .title { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; color: #ffffff; }
  .title .accent { color: #5eead4; }
  .rule { width: 92px; height: 5px; border-radius: 3px; background: #a78bfa; margin-top: 34px; }
  .sub { margin-top: 26px; font-size: 26px; font-weight: 500; color: #93a4c2; letter-spacing: -.2px; }
  /* Bottom-left corner of a real 48 x 48 tour from the post: turns are teal dots. */
  .art { position: absolute; right: 64px; top: 75px; width: 480px; height: 480px; }
</style>
</head>
<body>
<div id="card">
  <div class="left">
    <div class="title">The Knight's Tour<br/>With Fewest Turns:<br/><span class="accent">Solved by Agents</span></div>
    <div class="rule"></div>
    <div class="sub">8n &minus; 28 &le; turns &le; 8n &minus; 14</div>
  </div>
  <img class="art" src="knights_tour_turns_cover_tour.svg" alt="" />
</div>
</body>
</html>
