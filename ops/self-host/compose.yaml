# nilmamano.com on the shared VPS (~/nil/self-host-playbook.md; the model is bigOspeedrun's
# ops/self-host/compose.yaml). auto-deploy.sh runs it as:
#   docker compose -p nilmamano -f /opt/nilmamano/compose.yaml --env-file /opt/nilmamano/release.env up -d --wait
# release.env holds NM_SITE_IMAGE=ghcr.io/nmamano/nilmamano-site@sha256:<digest> (auto-deploy.sh
# rewrites it) and NM_UID / NM_GID, the dedicated system user both containers run as (set
# once by hand; auto-deploy.sh keeps them). Compose refuses to start without them.
#
# Networks: the site container is only on `egress`, an internal network (no route out),
# shared with the allowlist proxy. Caddy on the host reaches the site through the Unix
# socket in /run/nilmamano (nilmamano.tmpfiles.conf: 0755, the socket is 0666), so no port
# is published. Only the proxy is also on `outbound`, and it opens tunnels only to EGRESS_ALLOW.
name: nilmamano

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${NM_UID:?set in release.env}:${NM_GID:?set in release.env}"
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  site:
    <<: *hardening
    image: ${NM_SITE_IMAGE:?set in release.env}
    # ANTHROPIC_API_KEY, DISCORD_WEBHOOK_URL, RESEND_API_KEY, CONTACT_EMAIL, SENDER_API_KEY,
    # SENDER_GROUP_ID (root-only, 0600).
    env_file: /etc/nilmamano/site.env
    environment:
      SITE_SOCKET: /run/nilmamano/site.sock
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: 127.0.0.1,localhost
    # Next writes its cache here; the rest of the file system is read-only.
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=${NM_UID},gid=${NM_GID}
    volumes:
      - type: bind
        source: /run/nilmamano
        target: /run/nilmamano
    networks: [egress]
    depends_on:
      egress:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    # The image's HEALTHCHECK fetches / through the socket.

  egress:
    <<: *hardening
    # The same image and digest as the site: one artifact to pin and roll back.
    image: ${NM_SITE_IMAGE:?set in release.env}
    command: ["node", "egress-proxy.mjs"]
    environment:
      EGRESS_ALLOW: api.anthropic.com:443,discord.com:443,api.resend.com:443,api.sender.net:443
      EGRESS_PORT: "3128"
    networks: [egress, outbound]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  egress:
    internal: true
  outbound: {}
