# /etc/tmpfiles.d/nilmamano.conf. The directory for the site's Unix socket, which Caddy
# connects to. The directory is 0755 and the site creates the socket with mode 0666, so any
# local user can connect: the socket serves only what the public site serves (the same
# choice as bigOspeedrun, lead decision 2026-10-16).
# nm-site is a dedicated system user, created once:
#   useradd --system --no-create-home --shell /usr/sbin/nologin nm-site
# Its numeric uid and gid go in /opt/nilmamano/release.env as NM_UID and NM_GID.
d /run/nilmamano 0755 nm-site nm-site -
