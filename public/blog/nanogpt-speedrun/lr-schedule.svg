<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Learning rate schedule: flat for 30 percent then linear decay to zero" font-family="Inter, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="240" fill="#f7f8fa" rx="8"/>
  <line x1="70" y1="180" x2="680" y2="180" stroke="#5a6470" stroke-width="1.5"/>
  <line x1="70" y1="180" x2="70" y2="40" stroke="#5a6470" stroke-width="1.5"/>
  <polyline points="70,60 253,60 650,180" fill="none" stroke="#e0653e" stroke-width="2.5"/>
  <line x1="253" y1="60" x2="253" y2="180" stroke="#5a6470" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="60" y="65" text-anchor="end" fill="#2f3640" font-size="14" font-family="monospace">full LR</text>
  <text x="60" y="184" text-anchor="end" fill="#2f3640" font-size="14" font-family="monospace">0</text>
  <text x="253" y="200" text-anchor="middle" fill="#2f3640" font-size="14">step 1050 (30%)</text>
  <text x="650" y="200" text-anchor="middle" fill="#2f3640" font-size="14">step 3500</text>
  <text x="160" y="45" text-anchor="middle" fill="#2f3640" font-size="14" opacity="0.75">cruise at full speed</text>
  <text x="480" y="100" text-anchor="middle" fill="#2f3640" font-size="14" opacity="0.75">cool down to land precisely</text>
</svg>
