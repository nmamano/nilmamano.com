<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Causal attention: the last position takes a weighted average of earlier positions and cannot see future tokens" font-family="Inter, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#f7f8fa" rx="8"/>
  <text x="360" y="30" text-anchor="middle" fill="#2f3640" font-size="15">how much the highlighted position takes from each earlier position</text>
  <text x="360" y="50" text-anchor="middle" fill="#5a6470" font-size="13">(example percentages; thicker arc = higher weight)</text>
  <path d="M 72 146 C 95 70, 470 70, 513 144" fill="none" stroke="#e0653e" stroke-width="1.8" opacity="0.85"/>
  <path d="M 186 146 C 210 90, 480 90, 517 144" fill="none" stroke="#e0653e" stroke-width="5.5" opacity="0.95"/>
  <path d="M 300 146 C 322 110, 490 110, 521 144" fill="none" stroke="#e0653e" stroke-width="2.2" opacity="0.9"/>
  <path d="M 414 146 C 432 126, 500 126, 525 144" fill="none" stroke="#e0653e" stroke-width="1.2" opacity="0.85"/>
  <path d="M 642 146 C 628 112, 560 112, 533 142" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.9"/>
  <line x1="578" y1="110" x2="596" y2="128" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="596" y1="110" x2="578" y2="128" stroke="#c0392b" stroke-width="2.5"/>
  <text x="587" y="98" text-anchor="middle" fill="#c0392b" font-size="13" font-weight="bold" stroke="#f7f8fa" stroke-width="6" paint-order="stroke">masked</text>
  <g font-size="14" font-weight="bold" fill="#e0653e">
    <text x="72" y="136" text-anchor="middle" stroke="#f7f8fa" stroke-width="6" paint-order="stroke">10%</text>
    <text x="186" y="136" text-anchor="middle" stroke="#f7f8fa" stroke-width="6" paint-order="stroke">70%</text>
    <text x="300" y="136" text-anchor="middle" stroke="#f7f8fa" stroke-width="6" paint-order="stroke">15%</text>
    <text x="414" y="136" text-anchor="middle" stroke="#f7f8fa" stroke-width="6" paint-order="stroke">5%</text>
  </g>
  <g font-family="monospace" font-size="15">
    <rect x="30" y="150" width="84" height="40" rx="6" fill="none" stroke="#5a6470" stroke-width="1.4"/><text x="72" y="175" text-anchor="middle" fill="#2f3640">the</text>
    <rect x="144" y="150" width="84" height="40" rx="6" fill="none" stroke="#5a6470" stroke-width="1.4"/><text x="186" y="175" text-anchor="middle" fill="#2f3640">cat</text>
    <rect x="258" y="150" width="84" height="40" rx="6" fill="none" stroke="#5a6470" stroke-width="1.4"/><text x="300" y="175" text-anchor="middle" fill="#2f3640">sat</text>
    <rect x="372" y="150" width="84" height="40" rx="6" fill="none" stroke="#5a6470" stroke-width="1.4"/><text x="414" y="175" text-anchor="middle" fill="#2f3640">on</text>
    <rect x="486" y="150" width="84" height="40" rx="6" fill="none" stroke="#e0653e" stroke-width="2.5"/><text x="528" y="175" text-anchor="middle" fill="#e0653e">the</text>
    <rect x="600" y="150" width="84" height="40" rx="6" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="642" y="175" text-anchor="middle" fill="#c0392b">mat</text>
  </g>
  <text x="360" y="232" text-anchor="middle" fill="#5a6470" font-size="13">causal mask: no position may look to its right (into the future)</text>
</svg>
