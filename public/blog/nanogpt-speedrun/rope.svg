<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Channels are paired into 2D points, and every pair is rotated by the token's position" font-family="Inter, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#f7f8fa" rx="8"/>

  <text x="360" y="30" text-anchor="middle" fill="#2f3640" font-size="16" font-weight="bold">A vector of 128 numbers, split in half</text>

  <text x="30" y="64" fill="#5a6470" font-size="12.5">first half: channels 0-63</text>
  <g font-family="monospace" font-size="15" fill="#2f3640" text-anchor="middle">
    <rect x="30"  y="76" width="84" height="40" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="72"  y="102">0</text>
    <rect x="163" y="76" width="84" height="40" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="205" y="102">1</text>
    <rect x="296" y="76" width="84" height="40" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="338" y="102">2</text>
    <text x="471" y="102">...</text>
    <rect x="562" y="76" width="84" height="40" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="604" y="102">63</text>
  </g>

  <g stroke="#5a6470" stroke-width="1.4">
    <line x1="72"  y1="116" x2="72"  y2="150"/>
    <line x1="205" y1="116" x2="205" y2="150"/>
    <line x1="338" y1="116" x2="338" y2="150"/>
    <line x1="604" y1="116" x2="604" y2="150"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#5a6470" text-anchor="middle">
    <rect x="50"  y="126" width="44" height="15" fill="#f7f8fa"/><text x="72"  y="137">pair 0</text>
    <rect x="183" y="126" width="44" height="15" fill="#f7f8fa"/><text x="205" y="137">pair 1</text>
    <rect x="316" y="126" width="44" height="15" fill="#f7f8fa"/><text x="338" y="137">pair 2</text>
    <rect x="580" y="126" width="48" height="15" fill="#f7f8fa"/><text x="604" y="137">pair 63</text>
  </g>

  <g font-family="monospace" font-size="15" fill="#2f3640" text-anchor="middle">
    <rect x="30"  y="150" width="84" height="40" rx="5" fill="none" stroke="#3fa46a" stroke-width="2"/><text x="72"  y="176">64</text>
    <rect x="163" y="150" width="84" height="40" rx="5" fill="none" stroke="#3fa46a" stroke-width="2"/><text x="205" y="176">65</text>
    <rect x="296" y="150" width="84" height="40" rx="5" fill="none" stroke="#3fa46a" stroke-width="2"/><text x="338" y="176">66</text>
    <text x="471" y="176">...</text>
    <rect x="562" y="150" width="84" height="40" rx="5" fill="none" stroke="#3fa46a" stroke-width="2"/><text x="604" y="176">127</text>
  </g>
  <text x="30" y="208" fill="#5a6470" font-size="12.5">second half: channels 64-127</text>

  <text x="360" y="256" text-anchor="middle" fill="#2f3640" font-size="16" font-weight="bold">Every pair is rotated by the token's position, each at its own speed</text>

  <g>
    <!-- dial 1: fast -->
    <circle cx="100" cy="350" r="42" fill="none" stroke="#5a6470" stroke-width="1" opacity="0.35"/>
    <line x1="100" y1="350" x2="140" y2="350" stroke="#5a6470" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/>
    <line x1="100" y1="350" x2="63.8" y2="333.1" stroke="#e0653e" stroke-width="2.4"/><circle cx="63.8" cy="333.1" r="4.5" fill="#e0653e"/>
    <circle cx="100" cy="350" r="2.5" fill="#2f3640"/>
    <text x="100" y="298" text-anchor="middle" fill="#2f3640" font-size="12.5" font-weight="bold">pair 0</text>
    <text x="100" y="418" text-anchor="middle" fill="#5a6470" font-size="12">fast</text>
    <!-- dial 2: slower -->
    <circle cx="275" cy="350" r="42" fill="none" stroke="#5a6470" stroke-width="1" opacity="0.35"/>
    <line x1="275" y1="350" x2="315" y2="350" stroke="#5a6470" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/>
    <line x1="275" y1="350" x2="281.9" y2="310.6" stroke="#e0653e" stroke-width="2.4"/><circle cx="281.9" cy="310.6" r="4.5" fill="#e0653e"/>
    <circle cx="275" cy="350" r="2.5" fill="#2f3640"/>
    <text x="275" y="298" text-anchor="middle" fill="#2f3640" font-size="12.5" font-weight="bold">pair 15</text>
    <text x="275" y="418" text-anchor="middle" fill="#5a6470" font-size="12">slower</text>
    <!-- dial 3: slowest -->
    <circle cx="450" cy="350" r="42" fill="none" stroke="#5a6470" stroke-width="1" opacity="0.35"/>
    <line x1="450" y1="350" x2="490" y2="350" stroke="#5a6470" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/>
    <line x1="450" y1="350" x2="487.6" y2="336.3" stroke="#e0653e" stroke-width="2.4"/><circle cx="487.6" cy="336.3" r="4.5" fill="#e0653e"/>
    <circle cx="450" cy="350" r="2.5" fill="#2f3640"/>
    <text x="450" y="298" text-anchor="middle" fill="#2f3640" font-size="12.5" font-weight="bold">pair 31</text>
    <text x="450" y="418" text-anchor="middle" fill="#5a6470" font-size="12">slowest</text>
    <!-- dial 4: speed 0 -->
    <circle cx="625" cy="350" r="42" fill="none" stroke="#5a6470" stroke-width="1" opacity="0.35"/>
    <line x1="625" y1="350" x2="665" y2="350" stroke="#3fa46a" stroke-width="2.4"/><circle cx="665" cy="350" r="4.5" fill="#3fa46a"/>
    <circle cx="625" cy="350" r="2.5" fill="#2f3640"/>
    <text x="625" y="298" text-anchor="middle" fill="#2f3640" font-size="12.5" font-weight="bold">pair 48</text>
    <text x="625" y="418" text-anchor="middle" fill="#5a6470" font-size="12">speed 0</text>
  </g>
</svg>
