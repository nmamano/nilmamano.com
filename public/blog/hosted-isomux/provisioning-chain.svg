<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 8 980 594" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4a5c"/>
    </marker>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9550"/>
    </marker>
  </defs>

  <rect x="20" y="8" width="980" height="594" fill="#ffffff"/>

  <!-- signup -->
  <text x="45" y="28" font-size="13" font-weight="600" fill="#1a2030">Signup and payment write the first rows</text>
  <path d="M 150 36 L 150 104" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- chain group -->
  <rect x="30" y="52" width="960" height="336" rx="10" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="300" y="72" font-size="12" font-weight="700" fill="#3d4a5c" letter-spacing="0.4">THE PROVISIONING CHAIN &#183; ONE DATABASE ROW PER STEP, DRIVEN BY THE 5-SECOND TICK LOOP</text>

  <!-- row A -->
  <rect x="45" y="108" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="150" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">1. order the box</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">create_instance</text>

  <rect x="285" y="108" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="390" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">2. create the office's DNS records</text>
  <text x="390" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">create_dns</text>

  <rect x="525" y="108" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="630" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">3. wait for SSH to answer</text>
  <text x="630" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">wait_for_ssh</text>

  <rect x="765" y="108" width="210" height="46" rx="7" fill="#fdf1e7" stroke="#c05621" stroke-width="1.3"/>
  <text x="870" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">4. give our key a 7-day deadline</text>
  <text x="870" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#8a4a10">first_contact</text>

  <path d="M 257 131 L 281 131" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 497 131 L 521 131" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 737 131 L 761 131" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 870 156 L 870 214" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- row B, right to left -->
  <rect x="765" y="218" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="870" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">5. install the customer's key</text>
  <text x="870" y="256" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">install_customer_key</text>

  <rect x="525" y="212" width="210" height="58" rx="7" fill="#fdf1e7" stroke="#c05621" stroke-width="1.3"/>
  <text x="630" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">6. schedule the box to</text>
  <text x="630" y="246" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">delete our key</text>
  <text x="630" y="262" text-anchor="middle" font-size="11" font-family="monospace" fill="#8a4a10">arm_revocation</text>

  <rect x="285" y="218" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="390" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">7. wait for the package manager</text>
  <text x="390" y="256" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">wait_for_package_manager</text>

  <rect x="45" y="212" width="210" height="58" rx="7" fill="#e8f7ee" stroke="#1f9550" stroke-width="2"/>
  <text x="150" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2030">8. run the installer</text>
  <text x="150" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#146c33">run_installer</text>
  <text x="150" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#146c33">the whole installer diagram above</text>

  <path d="M 763 241 L 739 241" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 523 241 L 499 241" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 283 241 L 259 241" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 150 272 L 150 324" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- row C -->
  <rect x="45" y="328" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="150" y="350" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">9. check the office over HTTPS</text>
  <text x="150" y="366" text-anchor="middle" font-size="11" font-family="monospace" fill="#41506a">verify_https</text>

  <!-- live band -->
  <path d="M 150 376 L 150 408" fill="none" stroke="#1f9550" stroke-width="2" marker-end="url(#pg)"/>
  <rect x="30" y="412" width="960" height="44" rx="8" fill="#e8f7ee" stroke="#1f9550" stroke-width="1.5"/>
  <text x="510" y="439" text-anchor="middle" font-size="13" font-weight="600" fill="#15803c">The office is live. The chain stops here on purpose and waits for the customer.</text>

  <!-- customer-triggered -->
  <rect x="30" y="480" width="960" height="114" rx="10" fill="none" stroke="#8895a7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="45" y="500" font-size="12" font-weight="700" fill="#8a5a08" letter-spacing="0.4">WHAT THE CUSTOMER TRIGGERS FROM THE DASHBOARD</text>

  <rect x="45" y="512" width="210" height="46" rx="7" fill="#fff8ec" stroke="#b7791f" stroke-width="1.3"/>
  <text x="150" y="534" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">asks for a sign-in link</text>
  <text x="150" y="550" text-anchor="middle" font-size="11" font-family="monospace" fill="#7a4f06">mint_invite</text>

  <rect x="285" y="512" width="210" height="46" rx="7" fill="#eef1f5" stroke="#5a6a80" stroke-width="1.3"/>
  <text x="390" y="534" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">signs in to their office</text>
  <text x="390" y="550" text-anchor="middle" font-size="11" fill="#41506a">24h, single use</text>

  <rect x="525" y="512" width="210" height="46" rx="7" fill="#fff8ec" stroke="#b7791f" stroke-width="1.3"/>
  <text x="630" y="534" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">confirms they are in</text>
  <text x="630" y="550" text-anchor="middle" font-size="11" font-family="monospace" fill="#7a4f06">revoke_access</text>

  <rect x="765" y="512" width="210" height="46" rx="7" fill="#fdf1e7" stroke="#c05621" stroke-width="1.3"/>
  <text x="870" y="534" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2030">our key is gone</text>
  <text x="870" y="550" text-anchor="middle" font-size="11" fill="#8a4a10">proven, then destroyed</text>

  <path d="M 257 535 L 281 535" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 497 535 L 521 535" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>
  <path d="M 737 535 L 761 535" fill="none" stroke="#3d4a5c" stroke-width="1.5" marker-end="url(#pa)"/>

  <text x="45" y="580" font-size="12" fill="#3d4a5c">Seven days after signup, sshd expires our key on its own, whether or not any of this happened.</text>
</svg>
